 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Kata (Tic-Tac-Toe)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Home Screen -->
    <div id="homeScreen">
        <h1>Zero-Kata</h1>
        
        <!-- Mode Selection Buttons (Side-by-Side) -->
        <div class="mode-selector">
            <button id="pvpBtn" class="mode-btn">Player vs Player</button>
            <button id="pvcBtn" class="mode-btn">Player vs Computer</button>
        </div>

        <!-- Upcoming Games Button on Home Screen -->
        <div style="width: 100%; margin-top: 15px;">
            <button onclick="openUpcomingModal()" style="width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #ff9800, #f57c00); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);">
                🚀 Upcoming Games
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">

        <!-- Scoreboard -->
        <div class="scoreboard">
            <span id="oScore">0 Wins</span>
            <span id="xScore">0 Wins</span>
        </div>

        <!-- Round and Turn Info -->
        <div class="info-text">
            <span id="roundText">Round 1</span>
            <span id="turnText">O's Turn</span>
        </div>

        <!-- Game Board -->
        <div id="board"></div>

        <!-- Reset Button -->
        <button id="resetBtn">RESET SCORE</button>

        <!-- Chota Ratio Silent Banner Ad Container (320x50) at the bottom -->
        <div class="ad-banner-container" style="margin-top: 20px; text-align: center; width: 100%; max-width: 320px; margin-left: auto; margin-right: auto; overflow: hidden;">
            <!-- Yahan aap apna Adsterra ya Ad Network ka banner tag paste karenge -->
        </div>
    </div>

    <!-- Message Overlay (Win / Draw Popup) -->
    <div id="message" class="hidden">
        <h2 id="messageTitle"></h2>
        <p id="messageSub"></p>
    </div>

    <!-- Upcoming Game Popup Script -->
    <script>
        function openUpcomingModal() {
            alert("Coming Soon: Humara naya bachon ka educational aur coloring game jald aa raha hai!");
        }
    </script>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Kata (Tic-Tac-Toe)</title>
    <link rel="stylesheet" href="style.css?v=100">
</head>
<body>

    <!-- Home Screen -->
    <div id="homeScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 380px; padding: 20px; text-align: center; margin: auto; min-height: 100vh;">
        <h1 style="font-size: 2.8rem; margin-bottom: 25px; color: #38bdf8; font-weight: 800; letter-spacing: 1px;">Zero-Kata</h1>
        
        <!-- Mode Selection Buttons (Side-by-Side with Direct Styling) -->
        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 15px;">
            <button id="pvpBtn" style="flex: 1; background-color: #1e293b; color: #f8fafc; border: 2px solid #334155; padding: 12px 6px; font-size: 0.85rem; font-weight: 700; border-radius: 12px; cursor: pointer;">Player vs Player</button>
            <button id="pvcBtn" style="flex: 1; background-color: #1e293b; color: #f8fafc; border: 2px solid #334155; padding: 12px 6px; font-size: 0.85rem; font-weight: 700; border-radius: 12px; cursor: pointer;">Player vs Computer</button>
        </div>

        <!-- Upcoming Games Button on Home Screen -->
        <div style="width: 100%;">
            <button onclick="openUpcomingModal()" style="width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #ff9800, #f57c00); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem;">
                🚀 Upcoming Games
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">

        <!-- Scoreboard -->
        <div class="scoreboard">
            <span id="oScore">0 Wins</span>
            <span id="xScore">0 Wins</span>
        </div>

        <!-- Round and Turn Info -->
        <div class="info-text">
            <span id="roundText">Round 1</span>
            <span id="turnText">O's Turn</span>
        </div>

        <!-- Game Board -->
        <div id="board"></div>

        <!-- Reset Button -->
        <button id="resetBtn">RESET SCORE</button>

        <!-- Chota Ratio Silent Banner Ad Container (320x50) at the bottom -->
        <div class="ad-banner-container" style="margin-top: 20px; text-align: center; width: 100%; max-width: 320px; margin-left: auto; margin-right: auto; overflow: hidden;">
            <!-- Yahan aap apna Adsterra ya Ad Network ka banner tag paste karenge -->
        </div>
    </div>

    <!-- Message Overlay (Win / Draw Popup) -->
    <div id="message" class="hidden">
        <h2 id="messageTitle"></h2>
        <p id="messageSub"></p>
    </div>

    <!-- Upcoming Game Popup Script -->
    <script>
        function openUpcomingModal() {
            alert("Coming Soon: Humara naya bachon ka educational aur coloring game jald aa raha hai!");
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
